name: build

# Every push to main builds and is published as the latest release, which consoles update to.
# Run workflow builds any branch, as a draft unless it is main. No build runs on tags.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/readme/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push to the same branch replaces a build still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18 llvm-18-dev cmake ninja-build nodejs npm python3-venv \
            zlib1g-dev build-essential pkg-config unzip zip curl zstd exfatprogs exfat-fuse
          # The build wants unversioned clang and llvm-config in --llvm.
          for tool in clang clang++ llvm-config; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done
          clang --version | head -1
          llvm-config --version

      - name: Install the Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -r ps5-react/requirements.txt
          # The build spawns python3 for its own tools, so the venv goes on PATH.
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check the exfat packaging
        run: |
          mkdir -p "$RUNNER_TEMP/check/payload"
          printf 'eboot' > "$RUNNER_TEMP/check/payload/eboot.bin"
          # Big enough that the image gets the same geometry as the real one.
          head -c 24000000 /dev/urandom > "$RUNNER_TEMP/check/payload/data.bin"
          sudo bash packaging/make-exfat.sh "$RUNNER_TEMP/check/payload" \
            "$RUNNER_TEMP/check/check.exfat" CHECK

      - name: Cache the downloaded sources
        uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}

      - name: Stamp the fork build
        # Each build is one version above the last (fork.js), so the app updates to it.
        run: |
          sed -i "s/^  var FORK = [0-9]*;/  var FORK = $GITHUB_RUN_NUMBER;/" app/fork.js
          grep -q "var FORK = $GITHUB_RUN_NUMBER;" app/fork.js

      - name: Build
        working-directory: ps5-react
        run: python3 tools/build_ps5.py --app-dir "$GITHUB_WORKSPACE/app" --llvm /usr/bin

      - name: Package
        run: |
          sudo bash packaging/make-exfat.sh ps5-react/dist/PPSA99058 Overdrive.exfat OVERDRIVE
          # The in-app updater fetches one name, for an image install: the image
          # alone at the root of update.zip.
          zip -q -X -j update.zip Overdrive.exfat
          unzip -l update.zip
          ls -l Overdrive.exfat update.zip ps5-react/dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive
          path: |
            Overdrive.exfat
            update.zip
            ps5-react/dist/PPSA99058.receipt.json
          if-no-files-found: error

      - name: Release
        # A build of main is published at once as the latest release, which every console running
        # this fork reads (the in-app feed is releases/latest) and offers as an update. A build of
        # another branch stays a draft, seen only by people with write access. The release is named
        # after app/version.js and this build's number (fork.js).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app/version.js)
          test -n "$version" || { echo "no VERSION in app/version.js" >&2; exit 1; }
          tag="v$version.$GITHUB_RUN_NUMBER"
          assets="Overdrive.exfat update.zip"
          # Earlier drafts are superseded by this build.
          for old in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | .tag_name'); do
            gh release delete "$old" --yes || true
          done
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            gh release create "$tag" $assets --target "$GITHUB_SHA" --latest \
              --title "Overdrive $tag" --notes "MyLuxy/overdrive $version with TorBox and Premiumize. Build of $GITHUB_SHA."
          else
            gh release create "$tag" $assets --draft --target "$GITHUB_SHA" \
              --title "Overdrive $tag" --notes "Test build of $GITHUB_SHA from $GITHUB_REF_NAME."
          fi
          gh release view "$tag" --json isDraft,tagName,assets \
            --jq '"\(.tagName) draft=\(.isDraft) " + ([.assets[] | "\(.name) \(.size)"] | join(", "))'
