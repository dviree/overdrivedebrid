name: rescue deps

# MyLuxy's GitHub account is gone (404 since 2026-10-30), and with it MyLuxy/overdrive-deps, which held
# two build dependencies nothing else serves: the platform layer (ps5-homebrew-ui, a git repository
# pinned in ps5-react/dependencies.lock.json) and the PS5 OpenGL SDK archive (its sha256 is in the lock
# file too). This repository's build cache still holds both. This workflow copies them out once, so
# builds keep working once the cache expires:
#   - the platform repository's history, as platform.bundle (the pinned revision stays the same
#     commit, so the lock file's revision still names it), and
#   - the SDK archive,
# both to the release "build-deps-v1" here, a prerelease that is never the latest release (the app's
# update check and the catalog read the latest one).
# Run it from Actions → rescue deps → Run workflow. It changes nothing when both are already saved.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the build's cache of downloaded sources
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}
          fail-on-cache-miss: true

      - name: Check what the cache holds against the lock file
        run: |
          set -e
          revision=$(python3 -c "import json; print(json.load(open('ps5-react/dependencies.lock.json'))['platform']['revision'])")
          sha=$(python3 -c "import json; print(json.load(open('ps5-react/dependencies.lock.json'))['ps5OpenGL']['sha256'])")
          echo "platform pinned at $revision; SDK sha256 $sha"
          ls -la ps5-react/.deps
          git -C ps5-react/.deps/platform cat-file -e "$revision^{commit}"
          echo "$sha  ps5-react/.deps/ps5-opengl-sdk-1.0.0.tar.gz" | sha256sum -c -
          echo "REVISION=$revision" >> "$GITHUB_ENV"

      - name: Bundle the platform repository
        # A bundle, not a branch: its history holds workflow files, which this workflow's token may not
        # push. A bundle is one file holding every commit, and `git clone` takes it as a source.
        run: |
          set -e
          git -C ps5-react/.deps/platform bundle create "$RUNNER_TEMP/platform.bundle" --all
          git bundle verify "$RUNNER_TEMP/platform.bundle"
          git bundle list-heads "$RUNNER_TEMP/platform.bundle"
          rm -rf "$RUNNER_TEMP/check" && git clone -q "$RUNNER_TEMP/platform.bundle" "$RUNNER_TEMP/check"
          git -C "$RUNNER_TEMP/check" cat-file -e "$REVISION^{commit}"
          sha256sum "$RUNNER_TEMP/platform.bundle"

      - name: Save both to a prerelease
        run: |
          set -e
          tag=build-deps-v1
          files="ps5-react/.deps/ps5-opengl-sdk-1.0.0.tar.gz $RUNNER_TEMP/platform.bundle"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Build dependencies kept from MyLuxy/overdrive-deps" \
              --notes "MyLuxy/overdrive-deps is gone. platform.bundle holds the platform repository's history (the lock file pins its revision); ps5-opengl-sdk-1.0.0.tar.gz is checked by the lock file's sha256. Not an Overdrive release."
          fi
