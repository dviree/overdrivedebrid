name: sync upstream

# Merges MyLuxy/overdrive's main into this fork every six hours, so its fixes and features come
# here with TorBox, Premiumize and the computer page kept. A clean merge that passes the checks
# goes to main and starts a build; a conflict, a failed check or a change to the workflows (which
# this token may not push) opens an issue labelled upstream-sync instead, and main is left as it was.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/MyLuxy/overdrive.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "main is $behind commit(s) behind upstream"
          git log --oneline HEAD..upstream/main

      - name: Merge
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          if git merge --no-edit upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            {
              echo "result=conflict"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Check the merge
        id: check
        if: steps.merge.outputs.result == 'merged'
        run: |
          set -e
          # Every locale still parses.
          for file in app/i18n/locales/*.json; do node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" || { echo "bad JSON: $file"; exit 1; }; done
          # The framework's JavaScript tests.
          (cd ps5-react && npm ci --ignore-scripts --no-audit --no-fund && node --test runtime/js/*.test.mjs)
          # The whole app bundles: no import names a file or an export that is gone.
          npx --yes esbuild@0.23.0 app/index.jsx --bundle --format=esm --jsx=automatic --loader:.js=jsx \
            --loader:.ttf=empty --loader:.png=empty --loader:.wav=empty --loader:.jpg=empty \
            --alias:@ps5-react/core="$PWD/ps5-react/runtime/js/index.js" \
            --external:react --external:react/jsx-runtime --external:embedded-react \
            --outfile=/tmp/bundle-check.js --log-level=warning
          # This fork's own pieces are still wired in.
          grep -q "createTorboxResolver" app/state/downloads.js
          grep -q "createPremiumizeResolver" app/state/downloads.js
          grep -q "startRemote" app/index.jsx
          grep -q "FORK_FEED" app/state/update.js

      - name: Push and build
        id: push
        if: steps.merge.outputs.result == 'merged' && steps.check.outcome == 'success'
        run: |
          if git push origin HEAD:main; then
            gh workflow run build.yml --ref main
            echo "Merged upstream ${{ steps.fetch.outputs.upstream }} into main and started a build."
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report a merge that needs a hand
        if: always() && steps.fetch.outputs.behind != '0' && (steps.merge.outputs.result == 'conflict' || failure())
        env:
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          gh label create upstream-sync --color d93f0b --description "Merging MyLuxy/overdrive needs a hand" 2>/dev/null || true
          title="Upstream merge needs a hand (upstream ${{ steps.fetch.outputs.upstream }})"
          if gh issue list --state open --json title --jq '.[].title' 2>/dev/null | grep -qF "$title"; then
            echo "already reported"; exit 1
          fi
          {
            echo "Merging \`MyLuxy/overdrive\` main (${{ steps.fetch.outputs.upstream }}) into this fork's main needs a hand. Main was left as it was."
            echo
            if [ "${{ steps.merge.outputs.result }}" = conflict ]; then
              echo "Files in conflict:"
              echo
              printf '%s\n' "$FILES" | sed 's/^/- `/; s/$/`/'
            else
              echo "The merge went through but a check or the push failed (a change to the workflows can't be pushed by this token)."
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md
          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"
          # Issues can be turned off on a fork: then the summary above and this run's red mark (which
          # GitHub mails to the owner) are the report.
          gh issue create --label upstream-sync --title "$title" --body-file /tmp/body.md \
            || gh issue create --title "$title" --body-file /tmp/body.md \
            || echo "::warning::No issue opened (issues may be off for this repository)."
          exit 1
